name: Update fundraiser progress
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: fundraiser-progress
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Read public shop totals
        run: python3 scripts/sync-progress.py
      - name: Save latest count
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add progress.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh public fundraiser progress'
          git push
      - name: Prepare public site
        run: |
          mkdir _site
          cp index.html styles.css progress.js progress.json CNAME _site/
          cp -R assets _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
